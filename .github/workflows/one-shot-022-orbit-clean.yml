name: MONOLITH one-time signed Orbit icon correction
on:
  push:
    branches:
      - ops/dispatch-022-orbit-clean-20261112
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: "${{ github.repository == 'lolokeksu09/MONOLITH' && github.event.head_commit.message == 'ops: dispatch signed MONOLITH 0.22 Orbit clean update' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Verify main SHA, prerelease version and exact PR CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq '.sha')" = 'fe72e8da434dbf8e75e235a1bf8cc1405dadc90c'
          VERSION="$(gh api "repos/$GITHUB_REPOSITORY/contents/gradle.properties?ref=main" --jq '.content' | base64 --decode | sed -n 's/^monolithVersionName=//p')"
          test "$VERSION" = '0.22.0-beta'
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/43198897889" --jq '.conclusion')" = success
      - name: Run existing permanent-signature release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml -R "$GITHUB_REPOSITORY" --ref main
