name: MONOLITH one-shot signed release dispatch (2026-11-12)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monolith-once-20261112.yml'
permissions: {}
jobs:
  dispatch-existing-signed-release:
    if: "${{ github.repository == 'lolokeksu09/MONOLITH' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore: activate one-shot MONOLITH signed update' }}"
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch existing protected main release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$head_sha" = "$GITHUB_SHA"
          gh workflow run android.yml -R "$GITHUB_REPOSITORY" --ref main
