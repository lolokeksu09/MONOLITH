name: MONOLITH 0.24 one-time signed-release dispatch
on:
  push:
    branches: [ops/dispatch-024-orbit-management-20261112]
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    if: "${{ github.repository == 'lolokeksu09/MONOLITH' && github.event.head_commit.message == 'ops: dispatch tested MONOLITH 0.24 permanently signed release' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Require exact checked main revision, 0.24 version and passing tests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$REPO/commits/main" --jq '.sha')" = '62eb199cb43e927c1f6dcca6633a15b693244ab8'
          VERSION="$(gh api "repos/$REPO/contents/gradle.properties?ref=main" --jq '.content' | base64 --decode | sed -n 's/^monolithVersionName=//p')"
          test "$VERSION" = '0.24.0-beta'
          test "$(gh api "repos/$REPO/actions/runs/43213066969" --jq '.conclusion')" = 'success'
          test "$(gh api "repos/$REPO/actions/runs/43213597932" --jq '.conclusion')" = 'success'
      - name: Dispatch existing pinned-signature Android release workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run android.yml -R "$GITHUB_REPOSITORY" --ref main
