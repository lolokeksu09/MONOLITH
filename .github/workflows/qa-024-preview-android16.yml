name: MONOLITH 0.24 PR53 Android 16 preview visual QA
on:
  push:
    branches:
      - qa/024-preview-android16-20261112
    paths:
      - .github/workflows/qa-024-preview-android16.yml

permissions:
  contents: read
  actions: read

jobs:
  emulator-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Emulator acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install PR53 debug preview and inspect real screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/qa-monolith-024-preview.sh
      - name: Upload screenshots, UI hierarchies, logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MONOLITH-024-Preview-Android16-evidence
          path: qa-results-024/
          if-no-files-found: warn
          retention-days: 10
