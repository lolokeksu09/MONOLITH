name: MONOLITH 0.22 one-time signed release dispatch
on:
  push:
    branches: [ops/dispatch-022-premium-release-20261112]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: "${{ github.repository == 'lolokeksu09/MONOLITH' && github.event.head_commit.message == 'ops: dispatch verified MONOLITH 0.22 premium release' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Require checked main SHA, version and passing exact-head CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          EXPECTED_MAIN="60504ce760836376698bb8559e96d999ae4da47b"
          ACTUAL_MAIN="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"
          VERSION="$(gh api "repos/$REPO/contents/gradle.properties?ref=main" --jq '.content' | base64 --decode | sed -n 's/^monolithVersionName=//p')"
          test "$VERSION" = '0.22.0-beta'
          CI="$(gh api "repos/$REPO/actions/runs/43196986256" --jq '.conclusion')"
          test "$CI" = success
      - name: Request pinned-key signed release on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml -R "$GITHUB_REPOSITORY" --ref main
