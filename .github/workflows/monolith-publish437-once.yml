name: MONOLITH publish verified signed 0.20.0-beta.437 once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monolith-publish437-once.yml'
permissions: {}
jobs:
  publish-signed-existing-artifact:
    if: "${{ github.repository == 'lolokeksu09/MONOLITH' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore: publish verified MONOLITH 0.20.0-beta.437 once' }}"
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check source run, artifact and publish permanently signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO='lolokeksu09/MONOLITH'
          VERSION='0.20.0-beta.437'
          RELEASE_SOURCE='3cd47454e70edc3d6e7db185283d565187224232'
          RUN_ID=43170491599
          ARTIFACT_ID=13922086996
          APK_HASH='0aa933cfa52894eb076fb5432f6c4fcc271ce246d7a6a6c1b4cb908f8232e791'
          MAIN_SHA="$(gh api "repos/$REPO/commits/main" --jq '.sha')"
          test "$MAIN_SHA" = "$GITHUB_SHA"
          ACTUAL_SOURCE="$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.head_sha')"
          test "$ACTUAL_SOURCE" = "$RELEASE_SOURCE"
          ACTUAL_NAME="$(gh api "repos/$REPO/actions/artifacts/$ARTIFACT_ID" --jq '.name')"
          test "$ACTUAL_NAME" = 'MONOLITH-permanently-signed-release'
          if gh release view "v$VERSION" -R "$REPO" >/dev/null 2>&1; then
            echo 'Release already exists, refusing duplicate publication' >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signed"
          gh run download "$RUN_ID" -R "$REPO" -n 'MONOLITH-permanently-signed-release' -D "$RUNNER_TEMP/signed"
          APK="$RUNNER_TEMP/signed/app-release.apk"
          test -s "$APK"
          printf '%s  %s\n' "$APK_HASH" "$APK" | sha256sum -c -
          ASSET="MONOLITH-${VERSION}-signed.apk"
          cp "$APK" "$ASSET"
          gh release create "v$VERSION" "$ASSET" -R "$REPO" \
            --title "MONOLITH $VERSION" --target "$RELEASE_SOURCE" --prerelease \
            --notes "Permanently signed MONOLITH production APK built from source commit $RELEASE_SOURCE. Same pinned certificate as v0.20.0-beta.428, confirmed by signed-release GitHub Actions job 43170491599. This release includes the corrected RU/EN Orbit collapse label. APK SHA-256: $APK_HASH. Physical device testing remains open; keep the stock launcher installed."
