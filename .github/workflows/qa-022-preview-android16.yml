name: MONOLITH 0.22 preview visual QA Android 16 (corrected package)
on:
  push:
    branches:
      - qa/022-preview-android16-20261112
    paths:
      - '.github/workflows/qa-022-preview-android16.yml'

permissions:
  contents: read
  actions: read

jobs:
  preview-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Enable emulator KVM when present
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install and capture exact CI Preview on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/qa-monolith-022-preview.sh
      - name: Upload unedited screen captures, UI tree and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MONOLITH-022-Preview-Android16-visual-evidence
          path: qa-results/
          if-no-files-found: warn
          retention-days: 10
