name: MONOLITH 0.19 single-use signed-release dispatch
on:
  push:
    branches:
      - ops/dispatch-019-release-approved-20261111

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: "${{ github.repository == 'lolokeksu09/MONOLITH' && github.event.head_commit.message == 'ops: dispatch signed MONOLITH 0.19 release (approved)' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Confirm exact main revision and version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: cf4086c3f0b4a36c0e12af28880262a094ee8ec4
        run: |
          set -euo pipefail
          ACTUAL_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"
          VERSION="$(gh api "repos/${GITHUB_REPOSITORY}/contents/gradle.properties?ref=main" --jq '.content' | base64 --decode | sed -n 's/^monolithVersionName=//p')"
          test "$VERSION" = "0.19.0-beta"
      - name: Dispatch existing production release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref main
