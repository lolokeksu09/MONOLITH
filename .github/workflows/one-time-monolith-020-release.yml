name: MONOLITH 0.20 single-use signed-release dispatch
on:
  push:
    branches:
      - ops/dispatch-020-release-20261111

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: "${{ github.repository == 'lolokeksu09/MONOLITH' && github.event.head_commit.message == 'ops: dispatch signed MONOLITH 0.20 release (approved)' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Confirm exact main revision, version and successful verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN: 4cd84776b511e7bdf7f3b0838ebb90e7553f128a
        run: |
          set -euo pipefail
          ACTUAL_MAIN="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"
          VERSION="$(gh api "repos/${GITHUB_REPOSITORY}/contents/gradle.properties?ref=main" --jq '.content' | base64 --decode | sed -n 's/^monolithVersionName=//p')"
          test "$VERSION" = "0.20.0-beta"
          RESULT="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/43081707883" --jq '.conclusion')"
          test "$RESULT" = "success"
      - name: Launch existing signed-release workflow on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml --repo "$GITHUB_REPOSITORY" --ref main
