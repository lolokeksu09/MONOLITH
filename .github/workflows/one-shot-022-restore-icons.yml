name: MONOLITH 0.22 original icon style signed release
on:
  push:
    branches: [ops/dispatch-022-restore-icons-20261112]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    if: "${{ github.repository == 'lolokeksu09/MONOLITH' && github.event.head_commit.message == 'ops: dispatch signed MONOLITH 0.22 restored icons' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Verify main commit and original-icon PR CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          test "$(gh api "repos/$REPO/commits/main" --jq '.sha')" = '505077e15e7b04b90b69d8c1e636590f650c117c'
          VERSION="$(gh api "repos/$REPO/contents/gradle.properties?ref=main" --jq '.content' | base64 --decode | sed -n 's/^monolithVersionName=//p')"
          test "$VERSION" = '0.22.0-beta'
          test "$(gh api "repos/$REPO/actions/runs/43202174948" --jq '.conclusion')" = 'success'
      - name: Request permanent-signed main release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run android.yml -R "$GITHUB_REPOSITORY" --ref main
