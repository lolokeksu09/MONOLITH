name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Validate Android device-evidence and signing scripts
        run: bash -n scripts/setup-signing-termux.sh scripts/collect-device-acceptance.sh
      - name: Enforce unmodified native Android app icons
        run: python3 scripts/check_native_icon_fidelity.py
      - name: Unit tests, Android Lint, debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Enforce isolated Preview APK identity
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/debug/app-debug.apk | \
            grep -F "package: name='dev.monolith.launcher.preview'"
      - name: Verify release signing using a disposable CI-only key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export MONOLITH_KEYSTORE_FILE="$RUNNER_TEMP/monolith-ci-test-only.p12"
          export MONOLITH_KEY_PASSWORD="$(openssl rand -hex 32)"
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$MONOLITH_KEYSTORE_FILE" -alias monolith \
            -keyalg RSA -keysize 3072 -validity 30 \
            -dname "CN=MONOLITH CI ONLY, O=Test, C=US" \
            -storepass:env MONOLITH_KEY_PASSWORD -keypass:env MONOLITH_KEY_PASSWORD
          VERSION_BASE="$(sed -n 's/^monolithVersionName=//p' gradle.properties)"
          test -n "$VERSION_BASE"
          MONOLITH_VERSION_CODE=4 MONOLITH_VERSION_NAME="${VERSION_BASE}-ci" \
            gradle --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging \
            app/build/outputs/apk/release/app-release.apk | \
            grep -F "package: name='dev.monolith.launcher'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/release/app-release.apk
          rm -f "$MONOLITH_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MONOLITH-CI-debug-NOT-a-stable-signature
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  signed-release:
    needs: verify
    # User-authorized beta release for merging integration PR #60; all other
    # releases retain the explicit workflow_dispatch main-branch gate.
    # Never run the signing job for an open/updated pull request.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.number == 60 &&
       github.event.pull_request.base.ref == 'main' &&
       github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check signing configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_SECRET: ${{ secrets.MONOLITH_KEYSTORE_BASE64 }}
          PASSWORD_SECRET: ${{ secrets.MONOLITH_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_SECRET" || -z "$PASSWORD_SECRET" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Stable signing not configured: run scripts/setup-signing-termux.sh to create the two GitHub Secrets."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.signing.outputs.ready == 'true'
      - uses: actions/setup-java@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"
      - name: Build and verify permanently signed APK
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          MONOLITH_KEYSTORE_BASE64: ${{ secrets.MONOLITH_KEYSTORE_BASE64 }}
          MONOLITH_KEY_PASSWORD: ${{ secrets.MONOLITH_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          export MONOLITH_KEYSTORE_FILE="$RUNNER_TEMP/monolith-release.p12"
          printf '%s' "$MONOLITH_KEYSTORE_BASE64" | base64 --decode > "$MONOLITH_KEYSTORE_FILE"
          test -s "$MONOLITH_KEYSTORE_FILE"
          VERSION_BASE="$(sed -n 's/^monolithVersionName=//p' gradle.properties)"
          [[ "$VERSION_BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta$ ]] || { echo "Invalid prerelease version"; exit 1; }
          export MONOLITH_VERSION_CODE="$((10000 + GITHUB_RUN_NUMBER))"
          export MONOLITH_VERSION_NAME="${VERSION_BASE}.${GITHUB_RUN_NUMBER}"
          gradle --no-daemon :app:assembleRelease
          # The certificate fingerprint is public. Fail closed on accidental key rotation.
          SIGNED_CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk)"
          printf '%s\n' "$SIGNED_CERT" | grep -F 'Signer #1 certificate SHA-256 digest: de18d5f94e9a852c6eddb065f62c4f0f7a5dd23135b382cf6e91ff54ba7e1e0a'
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: MONOLITH-permanently-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish signed prerelease to GitHub Releases
        if: steps.signing.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION_BASE="$(sed -n 's/^monolithVersionName=//p' gradle.properties)"
          [[ "$VERSION_BASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta$ ]] || { echo "Invalid prerelease version"; exit 1; }
          VERSION_NAME="${VERSION_BASE}.${GITHUB_RUN_NUMBER}"
          ASSET="MONOLITH-${VERSION_NAME}-signed.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          NOTES_ARGS=(--notes "Permanently signed beta APK. Certificate pinned and verified. Refer to docs/CHANGELOG.md at this release tag for features and fixes. Physical Lenovo Legion Y70 / Motorola Android 16 acceptance is pending. Keep the stock launcher installed.")
          if [[ "$VERSION_BASE" == "0.25.0-beta" ]]; then
            NOTES_ARGS=(--notes-file docs/RELEASE_NOTES_0.25.md)
          elif [[ "$VERSION_BASE" == "0.25.1-beta" ]]; then
            NOTES_ARGS=(--notes-file docs/RELEASE_NOTES_0.25.1.md)
          fi
          gh release create "v${VERSION_NAME}" "$ASSET" \
            --title "MONOLITH ${VERSION_NAME}" \
            "${NOTES_ARGS[@]}" \
            --prerelease --target "$GITHUB_SHA"
      - name: Destroy temporary keystore copy
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/monolith-release.p12"
